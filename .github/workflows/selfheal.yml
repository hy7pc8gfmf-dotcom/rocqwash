# selfheal.yml - rocqwash self-heal CI watch (v1, 20261115).
#
# Mirror of the Main repo watch (rocqwash-triage.yml + rocqwash_triage.py)
# adapted for a hosted-runner, stateless face:
#   * trigger: workflow_run of "rocqwash CI" failure + */30 reconcile pass
#     + workflow_dispatch test mode (run_id input)
#   * triage: transient-infra vs content-red (suite-step verdict wins)
#   * heal: rerun-failed-jobs for transient-infra ONLY, three guards
#     (cancel-intent / attempt==1 stateless at-most-once / live re-check)
#   * reconcile: cancelled runs recorded as intent (NEVER revived, 20261115
#     order) + queue governor (MAX_QUEUED_RUNS, oldest trimmed)
#   * branch census: weekly READ-ONLY pass on the */30 schedule (run-number
#     gate, 336 = one week; dispatch input branch_census=true forces it) -
#     merged-stale branches reported to the desk log as deletion CANDIDATES;
#     never deleted in-run (20261117 order)
#   * content reds: recorded for the desk (artifact + job log) - the
#     E1/E2 wash engines take them once cast
#   * heartbeat: the workflow_dispatch `heartbeat` input appends ONE tick
#     line (UTC timestamp + status) to docs/heartbeat.jsonl, append-only
#     (existing lines never rewritten); when the gap since the previous
#     tick is strictly over 90 minutes (three missed */30 ticks) the
#     writer appends an ALERT line ahead of the tick (loss-of-contact
#     rule; line schema rocqwash.heartbeat/1). The Main-side runner
#     heartbeat is BLOCKED (403): the hosted workflow_dispatch tick is
#     the only heartbeat face, and the limitation is recorded in the
#     limits ledger.
# Rollback: delete this file, .github/scripts/selfheal_rocqwash.py and
#   .github/scripts/selfheal_heartbeat.py.
name: rocqwash self-heal

on:
  workflow_run:
    workflows: ["rocqwash CI"]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run id to triage (test mode; empty = reconcile only)'
        required: false
        default: ''
        type: string
      branch_census:
        description: 'force the weekly branch census in reconcile mode (true/false)'
        required: false
        default: 'false'
        type: string
      heartbeat:
        description: 'append one heartbeat tick line to docs/heartbeat.jsonl (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  actions: write
  contents: write
  # PUT /pulls/{n}/merge (the automerge leg) requires the pull-requests
  # scope; without it the merge PUT returns 403 Forbidden (20261117 PR #12).
  pull-requests: write

jobs:
  selfheal:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Guard (red run, dispatch test, or reconcile)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "watch: CI success - automerge-only pass (the */30 cron is GitHub-degraded to hours; the green CI completion is the fast automerge trigger)"
            echo "AUTOMERGE=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "watch: rocqwash CI run ${{ github.event.workflow_run.id }} concluded ${{ github.event.workflow_run.conclusion }}"
            echo "RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.run_id }}" ]; then
            echo "watch: dispatch test mode, run ${{ inputs.run_id }}"
            echo "RUN_ID=${{ inputs.run_id }}" >> "$GITHUB_ENV"
          else
            echo "watch: scheduled reconcile pass"
            echo "RECONCILE=1" >> "$GITHUB_ENV"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.branch_census }}" = "true" ]; then
            echo "census: forced by dispatch input"
            echo "ROCWASH_BRANCH_CENSUS=1" >> "$GITHUB_ENV"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.heartbeat }}" = "true" ]; then
            echo "heartbeat: dispatch tick requested"
            echo "HEARTBEAT=1" >> "$GITHUB_ENV"
          fi

      - name: Check out driver
        if: env.RUN_ID != '' || env.RECONCILE == '1' || env.AUTOMERGE == '1' || env.HEARTBEAT == '1'
        uses: actions/checkout@v5

      # heartbeat tick face: the append-only writer owns the >90min ALERT
      # rule (.github/scripts/selfheal_heartbeat.py); the commit-back makes
      # the line durable and a push race fails loud (resolve: re-dispatch)
      - name: Heartbeat tick (append-only JSONL; ALERT on a >90min silence gap)
        if: env.HEARTBEAT == '1'
        shell: bash
        run: |
          python3 .github/scripts/selfheal_heartbeat.py \
            --file docs/heartbeat.jsonl \
            --status ok \
            --source workflow_dispatch \
            --apply
          if [ ! -f docs/heartbeat.jsonl ]; then
            echo "heartbeat: writer reported apply but no ledger exists" >&2
            exit 1
          fi
          git config user.name "rocqwash heartbeat"
          git config user.email "actions@users.noreply.github.com"
          git add docs/heartbeat.jsonl
          git commit -m "heartbeat tick [skip ci]"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Self-heal leg (triage + heal, or reconcile, or automerge-only)
        if: env.RUN_ID != '' || env.RECONCILE == '1' || env.AUTOMERGE == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p selfheal-out
          if [ -n "${RUN_ID:-}" ]; then
            python3 .github/scripts/selfheal_rocqwash.py \
              --repo "${{ github.repository }}" \
              --run "$RUN_ID" \
              --out selfheal-out \
              --heal
          elif [ "${AUTOMERGE:-}" = "1" ]; then
            python3 .github/scripts/selfheal_rocqwash.py \
              --repo "${{ github.repository }}" \
              --run 0 \
              --out selfheal-out \
              --automerge-only
          else
            python3 .github/scripts/selfheal_rocqwash.py \
              --repo "${{ github.repository }}" \
              --run 0 \
              --out selfheal-out \
              --reconcile
          fi

      # Stable channel leg: the ONLY writer of the rolling `stable` tag.
      # The mover decides hold/wait/create/move itself (the newest green
      # run of the main-branch CI workflow, held only while its head
      # equals the current main head), so a pass triggered by a PR run
      # is a no-op hold; the move rule (never a human hand) lives in
      # .github/scripts/stable_channel.py and the README agent-sessions
      # face.
      - name: Stable channel leg (advance tags/stable to the green main head)
        if: env.AUTOMERGE == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .github/scripts/stable_channel.py \
            --repo "${{ github.repository }}" \
            --move

      - name: Upload triage artifacts
        if: always() && (env.RUN_ID != '' || env.RECONCILE == '1' || env.AUTOMERGE == '1')
        uses: actions/upload-artifact@v7
        with:
          name: selfheal-${{ env.RUN_ID || github.run_id }}
          path: selfheal-out/
          if-no-files-found: error
